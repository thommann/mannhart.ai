name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-latex-recommended texlive-font-utils tex-gyre

      - run: node scripts/generate-cv.js

      - run: npm run build

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete --exclude='.well-known'
          strict_hostkeys_checking: true
          path: _site/
          remote_path: /var/www/mannhart.ai/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: |
          cp src/_data/translations.js chatbot-server/translations.js
          cp src/_data/utils.js chatbot-server/utils.js

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz
          strict_hostkeys_checking: true
          path: chatbot-server/
          remote_path: /var/www/chatbot-server/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart chatbot server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/chatbot-server && npm install --production && sudo systemctl restart chatbot
            sleep 2
            curl --fail --retry 3 --retry-delay 2 http://localhost:3001/api/health
