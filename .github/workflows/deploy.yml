name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-latex-recommended texlive-font-utils tex-gyre

      - run: node scripts/generate-cv.js

      - run: npm run build

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete --exclude='.well-known'
          strict_hostkeys_checking: true
          path: _site/
          remote_path: ${{ secrets.SITE_DEPLOY_PATH }}
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: |
          cp src/_data/translations.js chatbot-server/translations.js
          cp src/_data/translations_en.json chatbot-server/translations_en.json
          cp src/_data/translations_de.json chatbot-server/translations_de.json
          cp src/_data/utils.js chatbot-server/utils.js

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz
          strict_hostkeys_checking: true
          path: chatbot-server/
          remote_path: ${{ secrets.CHATBOT_DEPLOY_PATH }}
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Authorize polyswiss deploy key (one-time bootstrap)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            grep -qF 'polyswiss-deploy' ~/.ssh/authorized_keys || echo 'ssh-rsa  polyswiss-deploy' >> ~/.ssh/authorized_keys

      - name: Restart chatbot server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.CHATBOT_DEPLOY_PATH }} && npm install --production && sudo systemctl restart ${{ secrets.CHATBOT_SERVICE }}
            sleep 2
            curl --fail --retry 3 --retry-delay 2 http://localhost:${{ secrets.CHATBOT_PORT }}/api/health
