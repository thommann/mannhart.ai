name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete --exclude='.well-known'
          strict_hostkeys_checking: true
          path: _site/
          remote_path: /var/www/mannhart.ai/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz
          strict_hostkeys_checking: true
          path: chatbot-server/
          remote_path: /var/www/chatbot-server/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure and restart chatbot server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /var/www/chatbot-server/.env << 'ENVEOF'
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
            LLM_MODEL=gemini-2.5-flash
            ALLOWED_ORIGIN=https://t.mannhart.ai
            PORT=3001
            ENVEOF
            cd /var/www/chatbot-server && npm install --production
            sudo systemctl daemon-reload
            sudo systemctl enable chatbot
            sudo systemctl restart chatbot
