name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete --exclude='.well-known'
          strict_hostkeys_checking: true
          path: _site/
          remote_path: REDACTED_PATH
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: REDACTED
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz
          strict_hostkeys_checking: true
          path: chatbot-server/
          remote_path: REDACTED_PATH/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: REDACTED
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart chatbot server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: REDACTED
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd REDACTED_PATH && npm install --production && sudo systemctl restart $SERVICE
