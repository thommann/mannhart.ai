name: Build Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=moderate

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-latex-recommended texlive-font-utils tex-gyre

      - run: node scripts/generate-cv.js

      - run: npm run build

      - name: Verify chatbot server
        run: |
          cp src/_data/translations.js chatbot-server/translations.js
          cp src/_data/translations_en.json chatbot-server/translations_en.json
          cp src/_data/translations_de.json chatbot-server/translations_de.json
          cp src/_data/utils.js chatbot-server/utils.js
          cd chatbot-server && npm ci
        env:
          LLM_API_KEY: test
      - name: Start chatbot server and check health
        run: |
          cd chatbot-server && node server.js &
          sleep 2
          curl --fail --retry 3 --retry-delay 2 http://localhost:3001/api/health
          kill %1
        env:
          LLM_API_KEY: test
